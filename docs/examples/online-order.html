<title>An online order</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#E9EFF6;color:#14233A;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:1.7rem;line-height:1.2;margin:0}
.lede{color:#51627A;max-width:680px;margin:8px 0 20px}

<body>
<main>
<h1>An online order</h1>
<p class="lede">What happens between a shopper pressing Pay and the warehouse packing the box. Press Play, or step through it.</p>
<style>
.df{--df-ink:#14233A;--df-ink2:#51627A;--df-line:#C9D4E2;--df-card:#fff;--df-head:#F3F6FA;color:var(--df-ink)}
.df-grid{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:28px;align-items:start}
.df-grid>div{min-width:0}
.df-svg{width:100%;height:auto;display:block;background:var(--df-card);border:1px solid var(--df-line);border-radius:4px}
.df-svg text{font-family:inherit;fill:var(--df-ink)}
.df-node{cursor:pointer;transition:opacity .15s}
.df-node rect{fill:var(--t);stroke:var(--c);stroke-width:1.5}
.df-node .df-ico{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.df-node .df-t{font-size:15px;font-weight:600}
.df-node .df-t3{font-size:13.5px;font-weight:600}
.df-node .df-s{font-size:12.5px;fill:var(--df-ink2)}
.df-node .df-s3{font-size:11.5px;fill:var(--df-ink2)}
.df-node.on rect{stroke-width:3}
.df-node.dim{opacity:.38}
.df-node:focus{outline:none}
.df-node:focus-visible rect,.df-node.picked rect{stroke:var(--df-ink);stroke-width:2.5}
.df-edge{fill:none;stroke:#B4C0D0;stroke-width:2}
.df-edge.on{stroke-width:3.5}
.df-edge.fwd,.df-edge.rev{stroke-dasharray:7 5;animation:df-march .7s linear infinite}
.df-edge.rev{animation-direction:reverse}
@keyframes df-march{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.df-edge.fwd,.df-edge.rev{animation:none;stroke-dasharray:none}}
.df-packet{pointer-events:none}
.df-packet rect{fill:#fff;stroke-width:1.6}
.df-packet text{font-size:12.5px;font-weight:600;fill:var(--df-ink)}
.df-pico{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.df-carry{display:inline-flex;align-items:center;gap:6px;margin:8px 0 0;font-size:.95rem;font-weight:600;border:1.5px solid var(--df-line);border-radius:3px;padding:3px 8px;background:#fff}
.df-carry[hidden]{display:none}
.df-carry svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.df-zone{fill:none;stroke:#8A99AD;stroke-dasharray:5 4}
.df-zone-l{font-size:12px;fill:var(--df-ink2);letter-spacing:.05em}
.df-k-person{--c:#1D4ED8;--t:#EEF3FF}
.df-k-mail{--c:#B45309;--t:#FFF4DE}
.df-k-program{--c:#334155;--t:#EEF2F6}
.df-k-ai{--c:#7C3AED;--t:#F3ECFF}
.df-k-store{--c:#15803D;--t:#E8F6EC}
.df-k-files{--c:#0F766E;--t:#E3F5F2}
.df-k-outside{--c:#BE123C;--t:#FDEBEF}
.df-k-web{--c:#0E7490;--t:#E4F4F9}
.df-k-output{--c:#4338CA;--t:#ECEEFF}
.df-k-time{--c:#A16207;--t:#FBF3D5}
.df-info{margin-top:10px;font-size:.95rem;color:var(--df-ink2);border-top:1px dashed var(--df-line);padding-top:10px}
.df-info b{color:var(--df-ink)}
.df-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.df-legend small{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--df-ink2);margin-right:2px}
.df-key{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;border:1px solid var(--df-line);border-radius:3px;padding:3px 8px 3px 6px;background:var(--df-card);color:var(--df-ink)}
.df-key svg{width:16px;height:16px;flex:none}
.df-key.act{border-color:transparent;color:#fff}
.df-seg{display:flex;flex-wrap:wrap;border:1px solid var(--df-line);border-radius:3px;overflow:hidden;background:var(--df-card);width:max-content;max-width:100%;margin-bottom:12px}
.df-seg button{font:inherit;font-size:.95rem;border:0;border-right:1px solid var(--df-line);background:transparent;padding:8px 12px;cursor:pointer;color:var(--df-ink)}
.df-seg button:last-child{border-right:0}
.df-seg button[aria-pressed="true"]{background:var(--df-ink);color:#fff}
.df-cap{background:var(--df-card);border:1px solid var(--df-line);border-left:5px solid var(--df-ink);border-radius:4px;padding:12px 14px;min-height:112px}
.df-caphead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.df-count{color:var(--df-ink2);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
.df-act{display:inline-flex;align-items:center;gap:5px;color:#fff;font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:3px 8px 3px 6px}
.df-act svg{width:15px;height:15px}
.df-text{margin:6px 0 0;font-size:1.05rem}
.df-nav{display:flex;gap:8px;margin-top:10px}
.df-nav button{font:inherit;font-size:.95rem;border:1px solid var(--df-line);background:var(--df-card);border-radius:3px;padding:7px 14px;cursor:pointer;color:var(--df-ink)}
.df-nav button:disabled{opacity:.4;cursor:default}
.df-nav .df-next{background:var(--df-ink);border-color:var(--df-ink);color:#fff}
.df-play{display:inline-flex;align-items:center;gap:6px}
.df-play svg{width:16px;height:16px}
.df-time{display:inline-flex;align-items:center;gap:5px;color:var(--df-ink2);font-size:.85rem}
.df-time[hidden]{display:none}
.df-time svg{width:15px;height:15px}
.df-leaves,.df-ifnot{display:flex;align-items:flex-start;gap:7px;margin:8px 0 0;font-size:.95rem;border-radius:3px;padding:6px 9px}
.df-leaves[hidden],.df-ifnot[hidden]{display:none}
.df-leaves{background:#FDECEC;color:#9B1C1C;font-weight:600}
.df-ifnot{background:#FFF6E0;color:#7A4B00}
.df-leaves svg,.df-ifnot svg{width:17px;height:17px;flex:none;margin-top:2px}
.df-item{margin-top:14px}
.df-item-h{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--df-ink2);margin:0 0 6px;font-weight:600}
.df-item-card{background:var(--df-card);border:1px solid var(--df-line);border-top:4px solid var(--df-line);border-radius:4px;font-size:.95rem}
.df-item-card.empty{padding:12px 14px;color:var(--df-ink2)}
.df-item-title{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--df-line);background:var(--df-head)}
.df-item-title svg{width:18px;height:18px;flex:none}
.df-item-fields{display:grid;grid-template-columns:minmax(80px,auto) minmax(0,1fr);gap:4px 14px;padding:10px 14px;margin:0}
.df-item-fields dt{color:var(--df-ink2);font-size:.88rem}
.df-item-fields dd{margin:0;overflow-wrap:anywhere}
.df-item-body{margin:0;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;border-top:1px solid var(--df-line)}
.df-item-fields + .df-item-body{border-top:1px dashed var(--df-line)}
.df-item-title + .df-item-body{border-top:0}
.df-edge.trail{stroke-width:2.6;opacity:.4}
.df-node.seen{opacity:.72}
.df-steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:3px}
.df-steps button{font:inherit;font-size:.95rem;text-align:left;width:100%;border:1px solid transparent;background:transparent;border-radius:3px;padding:5px 8px;cursor:pointer;color:var(--df-ink2);display:grid;grid-template-columns:26px 18px minmax(0,1fr);gap:8px;align-items:start}
.df-steps button[aria-current="step"]{background:var(--df-head);border-color:var(--df-line);color:var(--df-ink);font-weight:600}
.df-chip{width:26px;height:26px;border-radius:3px;display:grid;place-items:center;color:#fff}
.df-chip svg{width:15px;height:15px}
.df-num{color:var(--df-ink2);font-variant-numeric:tabular-nums}
@media (max-width:820px){.df-grid{grid-template-columns:1fr}}

<script>
(function(){
// The part of a data-flow diagram that runs in the reader's browser.
// The builder copies this file into each page it makes. The tests import it directly.

// What the diagram shows at one step. No page needed: this is plain data in, plain data out.
function stepView(data, scenarioId, index) {
  const scn = data.scenarios.find((s) => s.id === scenarioId);
  if (!scn) throw new Error('unknown scenario: ' + scenarioId);
  const i = Math.max(0, Math.min(index, scn.steps.length - 1));
  const st = scn.steps[i];
  const edges = {};
  st.edges.forEach((pair) => { edges[pair[0]] = pair[1]; });
  // the trail: lines and parts used by earlier steps, each line in the colour of its latest action
  const trail = {};
  const seen = [];
  scn.steps.slice(0, i).forEach((prev) => {
    prev.edges.forEach((pair) => { if (!(pair[0] in edges)) trail[pair[0]] = prev.action; });
    prev.nodes.forEach((n) => { if (st.nodes.indexOf(n) < 0 && seen.indexOf(n) < 0) seen.push(n); });
  });
  return {
    scenario: scn.id,
    index: i,
    count: scn.steps.length,
    action: st.action,
    text: st.text,
    edges, // edge id -> 'f' (along the line), 'b' (against it) or 'x' (both ways)
    nodes: st.nodes.slice(),
    trail, // edge id -> the action of the latest earlier step that used it
    seen, // parts used by earlier steps and not by this one
    carry: st.carry || null, // what travels on the line: { label, icon }
    item: st.item || null, // a sample of the real item: { title, icon, fields, body }
    leaves: (st.leaves || []).slice(), // parts outside the owner's system that receive data
    time: st.time || '',
    ifNot: st.ifNot || '',
    first: i === 0,
    last: i === scn.steps.length - 1,
  };
}

// The first sentence of a step, for the step list.
function shortText(text) {
  const m = /^(.*?[.?!])(\s|$)/.exec(text);
  return (m ? m[1] : text).replace(/\.$/, '');
}

// How visible a travelling tag is at time t (0 to 1) in its loop. A one-way tag fades in as it
// leaves and fades out as it arrives, so it never jumps back to the start. A tag that goes there
// and back, or one that does not move, stays fully visible.
function tagOpacity(t, dir, stationary) {
  if (stationary || dir === 'x') return 1;
  const EDGE = 0.18;
  return Math.max(0, Math.min(1, t / EDGE, (1 - t) / EDGE));
}

// Reads a link to one step: "#<diagram id>=<scenario id>.<step number>".
function readLink(hash, prefix, data) {
  const m = new RegExp('[#&]' + prefix + '=([a-z][a-z0-9-]*)\\.(\\d+)').exec(hash || '');
  if (!m) return null;
  const scn = data.scenarios.find((s) => s.id === m[1]);
  if (!scn) return null;
  return { scenario: scn.id, index: Math.max(0, Math.min(Number(m[2]) - 1, scn.steps.length - 1)) };
}

// Wires one diagram on the page. root is the element the builder wrote.
function mount(root, data, prefix) {
  const q = (s) => root.querySelector(s);
  const qa = (s) => [].slice.call(root.querySelectorAll(s));
  let cur = data.scenarios[0].id;
  let i = 0;
  const link = readLink(window.location.hash, prefix, data);
  if (link) { cur = link.scenario; i = link.index; }
  const list = q('.df-steps');
  const back = q('.df-back');
  const next = q('.df-next');
  const play = q('.df-play');
  const info = q('.df-info');
  const card = q('.df-item-card');
  const edgeLayer = q('.df-edges');
  const packetLayer = q('.df-packets');
  const svg = q('.df-svg');
  const NS = 'http://www.w3.org/2000/svg';
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let packets = [];
  let timer = null;

  // A tag that rides along a line: an icon and a few words, in the step's colour.
  function makePacket(path, dir, carry, color) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'df-packet');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('rx', '3');
    rect.setAttribute('height', '26');
    rect.setAttribute('y', '-13');
    rect.style.stroke = color;
    const icon = document.createElementNS(NS, 'g');
    icon.setAttribute('class', 'df-pico');
    icon.innerHTML = carry.icon;
    icon.style.stroke = color;
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('y', '4.4');
    text.textContent = carry.label;
    g.appendChild(rect);
    g.appendChild(icon);
    g.appendChild(text);
    packetLayer.appendChild(g);
    let tw = 0;
    try { tw = text.getComputedTextLength(); } catch (e) { tw = 0; }
    if (!tw) tw = carry.label.length * 6.9; // the panel is hidden, so measure by count
    const w = tw + 34;
    rect.setAttribute('x', String(-w / 2));
    rect.setAttribute('width', String(w));
    icon.setAttribute('transform', 'translate(' + (-w / 2 + 7) + ' -7) scale(.5833)');
    text.setAttribute('x', String(-w / 2 + 26));
    const tag = path.getAttribute('data-tag');
    const fixed = tag ? tag.split(',').map(Number) : null;
    return { g, path, dir, w, len: path.getTotalLength(), fixed };
  }

  function place(pk, t) {
    let f = t;
    if (pk.dir === 'b') f = 1 - t;
    if (pk.dir === 'x') f = t < 0.5 ? t * 2 : 2 - t * 2;
    if (still) f = 0.5;
    const pt = pk.fixed ? { x: pk.fixed[0], y: pk.fixed[1] } : pk.path.getPointAtLength(pk.len * (0.12 + 0.76 * f));
    const vb = svg.viewBox.baseVal;
    const x = Math.max(pk.w / 2 + 2, Math.min(vb.width - pk.w / 2 - 2, pt.x));
    pk.g.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + pt.y.toFixed(1) + ')');
    pk.g.style.opacity = String(tagOpacity(t, pk.dir, !!pk.fixed || still));
  }

  function tick(now) {
    const t = (now % 2200) / 2200;
    packets.forEach((pk) => place(pk, t));
    window.requestAnimationFrame(tick);
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // The side panel: a sample of the real item that moves in this step.
  function showItem(v, color) {
    card.innerHTML = '';
    card.style.borderTopColor = v.item ? color : '';
    card.classList.toggle('empty', !v.item);
    if (!v.item) {
      card.textContent = v.carry ? v.carry.label : 'No item moves in this step.';
      return;
    }
    const head = el('div', 'df-item-title');
    const ico = document.createElementNS(NS, 'svg');
    ico.setAttribute('viewBox', '0 0 24 24');
    ico.setAttribute('fill', 'none');
    ico.setAttribute('stroke-width', '2');
    ico.setAttribute('stroke-linecap', 'round');
    ico.setAttribute('stroke-linejoin', 'round');
    ico.setAttribute('aria-hidden', 'true');
    ico.style.stroke = color;
    ico.innerHTML = v.item.icon;
    head.appendChild(ico);
    head.appendChild(el('span', '', v.item.title));
    card.appendChild(head);
    if (v.item.fields.length) {
      const dl = el('dl', 'df-item-fields');
      v.item.fields.forEach((pair) => {
        dl.appendChild(el('dt', '', pair[0]));
        dl.appendChild(el('dd', '', pair[1]));
      });
      card.appendChild(dl);
    }
    if (v.item.body) card.appendChild(el('pre', 'df-item-body', v.item.body));
  }

  function setNote(sel, show, icon, text) {
    const p = q(sel);
    p.hidden = !show;
    if (!show) return;
    p.innerHTML = icon + '<span></span>';
    p.lastChild.textContent = text;
  }

  function draw() {
    const v = stepView(data, cur, i);
    i = v.index; // a press past the last step stays on the last step
    const act = data.actions[v.action];
    packetLayer.innerHTML = '';
    packets = [];
    qa('.df-edge').forEach((p) => {
      p.classList.remove('on', 'fwd', 'rev', 'trail');
      p.style.stroke = '';
      p.removeAttribute('marker-end');
      p.removeAttribute('marker-start');
    });
    Object.keys(v.trail).forEach((id) => {
      const p = q('[data-edge="' + id + '"]');
      p.classList.add('trail');
      p.style.stroke = data.actions[v.trail[id]].color;
    });
    Object.keys(v.edges).forEach((id) => {
      const p = q('[data-edge="' + id + '"]');
      const dir = v.edges[id];
      const marker = 'url(#' + prefix + '-m-' + v.action + ')';
      p.classList.add('on');
      p.style.stroke = act.color;
      if (dir !== 'b') p.setAttribute('marker-end', marker);
      if (dir !== 'f') p.setAttribute('marker-start', marker);
      if (dir === 'f') p.classList.add('fwd');
      if (dir === 'b') p.classList.add('rev');
      edgeLayer.appendChild(p); // the moving line is drawn above the idle lines
      if (v.carry) packets.push(makePacket(p, dir, v.carry, act.color));
    });
    packets.forEach((pk) => place(pk, 0.5));
    qa('.df-node').forEach((g) => {
      const id = g.getAttribute('data-node');
      const on = v.nodes.indexOf(id) >= 0;
      const seen = v.seen.indexOf(id) >= 0;
      g.classList.toggle('on', on);
      g.classList.toggle('seen', !on && seen);
      g.classList.toggle('dim', !on && !seen);
    });
    q('.df-count').textContent = 'Step ' + (v.index + 1) + ' of ' + v.count;
    const badge = q('.df-act');
    badge.innerHTML = act.icon + '<span></span>';
    badge.lastChild.textContent = act.label;
    badge.style.background = act.color;
    setNote('.df-time', !!v.time, data.ui.clock, v.time);
    q('.df-cap').style.borderLeftColor = act.color;
    const chip = q('.df-carry');
    if (v.carry) {
      chip.hidden = false;
      chip.style.borderColor = act.color;
      chip.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"></svg><span></span>';
      chip.firstChild.innerHTML = v.carry.icon;
      chip.firstChild.style.stroke = act.color;
      chip.lastChild.textContent = 'Carries: ' + v.carry.label;
    } else {
      chip.hidden = true;
    }
    setNote('.df-leaves', v.leaves.length > 0, data.ui.out, 'Leaves your system: sent to ' + v.leaves.join(' and ') + '.');
    setNote('.df-ifnot', !!v.ifNot, data.ui.branch, 'If not: ' + v.ifNot);
    q('.df-text').textContent = v.text;
    showItem(v, act.color);
    back.disabled = v.first;
    next.disabled = v.last;
    qa('.df-steps button').forEach((b, k) => {
      if (k === v.index) b.setAttribute('aria-current', 'step');
      else b.removeAttribute('aria-current');
    });
    root.setAttribute('data-scenario', v.scenario);
    root.setAttribute('data-step', String(v.index + 1));
    root.setAttribute('data-action', v.action);
    if (timer && v.last) stop();
  }

  function setPlayLabel(on) {
    play.innerHTML = (on ? data.ui.pause : data.ui.play) + '<span></span>';
    play.lastChild.textContent = on ? 'Pause' : 'Play';
    play.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function stop() {
    if (timer) window.clearInterval(timer);
    timer = null;
    setPlayLabel(false);
  }
  function start() {
    const scn = data.scenarios.find((s) => s.id === cur);
    if (i >= scn.steps.length - 1) i = 0; // at the end, Play starts again from step 1
    draw();
    setPlayLabel(true);
    timer = window.setInterval(() => { i += 1; draw(); }, 2600);
  }

  function build() {
    list.innerHTML = '';
    const scn = data.scenarios.find((s) => s.id === cur);
    scn.steps.forEach((st, k) => {
      const act = data.actions[st.action];
      const li = document.createElement('li');
      const b = document.createElement('button');
      const chip = document.createElement('span');
      const num = document.createElement('span');
      const txt = document.createElement('span');
      chip.className = 'df-chip';
      chip.style.background = act.color;
      chip.innerHTML = act.icon;
      chip.setAttribute('title', act.label);
      num.className = 'df-num';
      num.textContent = String(k + 1);
      txt.textContent = shortText(st.text);
      b.type = 'button';
      b.appendChild(chip);
      b.appendChild(num);
      b.appendChild(txt);
      b.addEventListener('click', () => { stop(); i = k; draw(); });
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  qa('.df-seg button').forEach((b) => {
    b.setAttribute('aria-pressed', b.getAttribute('data-s') === cur ? 'true' : 'false');
    b.addEventListener('click', () => {
      stop();
      cur = b.getAttribute('data-s');
      i = 0;
      qa('.df-seg button').forEach((o) => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
      build();
      draw();
    });
  });
  back.addEventListener('click', () => { stop(); if (i > 0) { i -= 1; draw(); } });
  next.addEventListener('click', () => { stop(); i += 1; draw(); });
  play.addEventListener('click', () => { if (timer) stop(); else start(); });
  root.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { stop(); i += 1; draw(); }
    if (e.key === 'ArrowLeft' && i > 0) { stop(); i -= 1; draw(); }
  });
  qa('.df-node').forEach((g) => {
    function pick() {
      const n = data.nodes[g.getAttribute('data-node')];
      info.innerHTML = '';
      const b = document.createElement('b');
      b.textContent = n.label + '. ';
      info.appendChild(b);
      info.appendChild(document.createTextNode(n.info || 'No note for this part.'));
      qa('.df-node').forEach((o) => o.classList.toggle('picked', o === g));
    }
    g.addEventListener('click', pick);
    g.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
    });
  });
  setPlayLabel(false);
  build();
  draw();
  window.requestAnimationFrame(tick);
}
